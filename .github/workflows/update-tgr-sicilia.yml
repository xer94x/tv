name: Update TGR Sicilia Playlist

# aggiornato: 2026-08-01
on:
  schedule:
    - cron: '*/15 7-23 * * *'   # ogni 15 min, dalle 07:00 alle 23:45 UTC
  workflow_dispatch:

concurrency:
  group: update-tgr-sicilia
  cancel-in-progress: false

jobs:
  update-tgr:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Esegui script fetch TGR Sicilia
        id: fetch
        run: python scripts/fetch_tgr_sicilia.py
        continue-on-error: true

      - name: Commit e push se ci sono modifiche
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f tgr_sicilia.m3u ]; then
            git add tgr_sicilia.m3u
            git diff --cached --quiet || git commit -m "📺 Aggiorna VOD TGR Sicilia - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          else
            echo "ℹ️  tgr_sicilia.m3u non trovato, nessun commit."
          fi
