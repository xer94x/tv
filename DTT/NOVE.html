<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>NOVE</title>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }
    .badge { background: #0066cc; color: white; font-size: 13px; font-weight: bold; letter-spacing: 0.08em; padding: 5px 11px; border-radius: 4px; text-transform: uppercase; }
    .title { font-size: 26px; font-weight: normal; }
    .title span { color: #aaa; font-size: 18px; margin-left: 6px; }
    .msg { font-size: 15px; color: #888; letter-spacing: 0.04em; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #2a2a2a;
      border-top-color: #0066cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .manual { margin-top: 1rem; font-size: 13px; color: #444; }
    .manual a { color: #0066cc; text-decoration: none; }
    .manual a:hover { text-decoration: underline; }
    .channel-logo {
      width: 120px;
      height: auto;
      border-radius: 12px;
    }
  </style>
</head>
<body>

 <img class="channel-logo" src="https://i.ibb.co/jPZ8bzRP/009-nove-it.png" alt="Nove">
  <span class="badge">DISCOVERY</span>
  <p class="title">NOVE<span></p>
  <div class="spinner"></div>
  <p class="msg">Caricamento…</p>

  <script>
    var url = "https://d31mw7o1gs0dap.cloudfront.net/v1/master/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-y5pbi2sq9r609/NOVE_IT.m3u8";
    var link = document.getElementById("link");
    if (link) link.href = url;
    setTimeout(function() { window.location.href = url; }, 800);
  </script>

</body>
</html>
