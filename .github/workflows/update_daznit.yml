name: Update DAZNIT M3U

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser

      - name: Generate daznit.m3u with thumbnails
        run: |
          python - <<'PY'
          from pathlib import Path
          import feedparser

          FEED_URL = "https://www.youtube.com/feeds/videos.xml?channel_id=UC7N8IuYFhU8Hs1ruCTsXTbg"
          OUTPUT_FILE = Path("daznit.m3u")
          MAX_ITEMS = 50

          feed = feedparser.parse(FEED_URL)
          entries = feed.entries[:MAX_ITEMS]

          lines = ["#EXTM3U"]

          for entry in entries:
              title = entry.get("title", "Senza titolo").replace("\n", " ").strip()
              link = entry.get("link", "").strip()

              thumb = ""
              media_thumbnail = entry.get("media_thumbnail")
              if media_thumbnail and isinstance(media_thumbnail, list):
                  thumb = media_thumbnail[0].get("url", "").strip()

              if not link:
                  continue

              if thumb:
                  lines.append(f'#EXTINF:-1 tvg-logo="{thumb}",{title}')
              else:
                  lines.append(f'#EXTINF:-1,{title}')
              lines.append(link)

          OUTPUT_FILE.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daznit.m3u
          git commit -m "Update daznit.m3u with thumbnails" || exit 0
          git push
