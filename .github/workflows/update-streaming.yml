name: update-streaming

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assicura presenza file
        run: |
          for f in freetv.m3u samsung.m3u webtv.m3u netplus.mpd netplus.m3u roku_all.m3u pluto.m3u usaTV.m3u streaming.m3u; do
            [ -f "$f" ] || touch "$f"
          done

      - name: Aggiorna playlist sorgenti
        run: |
          download() {
            local url="$1"
            local file="$2"
            echo "→ $file da $url"
            [ -f "$file" ] || touch "$file"

            if curl -fsSL --max-time 30 "$url" -o "$file.tmp" && \
               grep -q "#EXTINF\|#EXTM3U\|#KODIPROP\|#EXT-X-STREAM-INF\|http" "$file.tmp"; then
              mv "$file.tmp" "$file"
              echo "✔ Aggiornato $file"
            else
              echo "⚠ Download fallito o contenuto non valido per $file, mantengo il file esistente"
              rm -f "$file.tmp"
            fi
          }

          download "https://cdn.jsdelivr.net/gh/Free-TV/IPTV@master/playlists/playlist_italy.m3u8" "freetv.m3u"
          download "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/samsungtvplus_it.m3u" "samsung.m3u"
          download "https://iptv-ch.github.io/webtv.m3u" "webtv.m3u"
          download "https://iptv-ch.github.io/netplus.mpd" "netplus.mpd"
          download "https://iptv-ch.github.io/netplus.m3u8" "netplus.m3u"
          download "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/roku_all.m3u" "roku_all.m3u"
          download "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plutotv_it.m3u" "pluto.m3u"
          download "https://s.id/d9M3U8" "usaTV.m3u"

      - name: Aggiorna streaming.m3u
        run: python3 scripts/update_streaming.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add freetv.m3u samsung.m3u webtv.m3u netplus.mpd netplus.m3u roku_all.m3u pluto.m3u usaTV.m3u streaming.m3u

          if git diff --cached --quiet; then
            echo "Nessuna modifica, skip commit."
          else
            git commit -m "chore: update streaming e playlist $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
