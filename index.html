<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Player — Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
  :root{
    --bg:        #10141a;
    --panel:     #171d26;
    --panel-2:   #1d2531;
    --line:      #2a3341;
    --text:      #e9ebee;
    --text-dim:  #8b95a5;
    --amber:     #f0a83c;
    --amber-dim: #7a5a2a;
    --cyan:      #4fb8c4;
    --red-live:  #e6483f;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    overflow:hidden;
  }

  .app{
    display:flex;
    align-items:stretch;
    height:100vh;
    width:100vw;
    overflow:hidden;
  }

  /* ── sidebar ─────────────────────────────────────────────────────── */
  .sidebar{
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-height:0;
    flex:0 0 340px;
    width:340px;
    min-width:300px;
    max-width:420px;
    transition:min-width .18s ease, max-width .18s ease, width .18s ease, border-color .18s ease;
  }
  .sidebar.collapsed{
    flex-basis:0;
    min-width:0;
    max-width:0;
    width:0;
    border-right-color:transparent;
    overflow:hidden;
  }
  .sidebar-head{
    padding:16px 16px 12px;
    border-bottom:1px solid var(--line);
  }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:12px;
  }
  .brand{
    font-family:var(--mono);
    font-weight:700;
    font-size:13px;
    letter-spacing:.14em;
    color:var(--text-dim);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .collapse-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    width:22px;
    height:22px;
    padding:0;
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--mono);
    font-size:11px;
    line-height:1;
    flex-shrink:0;
    cursor:pointer;
  }
  .collapse-btn:hover{border-color:var(--amber); color:var(--amber);}
  .sidebar-reopen{
    display:none;
    position:fixed;
    left:0;
    top:16px;
    z-index:15;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:none;
    color:var(--text-dim);
    width:22px;
    height:34px;
    padding:0;
    border-radius:0 4px 4px 0;
    align-items:center;
    justify-content:center;
    font-family:var(--mono);
    font-size:11px;
    cursor:pointer;
  }
  .sidebar-reopen:hover{border-color:var(--amber); color:var(--amber);}
  .sidebar-reopen.show{display:flex;}
  @media (max-width: 760px){
    .sidebar-reopen{display:none !important;}
  }
  .brand .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 6px var(--amber);
  }
  .playlist-controls{display:flex; flex-direction:column; gap:6px;}
  .row{display:flex; gap:6px;}
  input[type=text]{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 10px;
    border-radius:4px;
    font-family:var(--sans);
    font-size:12.5px;
    min-width:0;
  }
  input[type=text]:focus{outline:1px solid var(--amber); border-color:var(--amber);}
  button{
    font-family:var(--mono);
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    border-radius:4px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    padding:8px 12px;
    cursor:pointer;
    transition:border-color .12s, color .12s;
  }
  button:hover{border-color:var(--amber); color:var(--amber);}
  button:focus-visible{outline:2px solid var(--amber); outline-offset:1px;}
  button.primary{
    background:var(--amber);
    color:#1a1206;
    border-color:var(--amber);
  }
  button.primary:hover{background:#f5b859; color:#1a1206;}
  .file-btn{position:relative; overflow:hidden;}
  .file-btn input[type=file]{
    position:absolute; inset:0; opacity:0; cursor:pointer;
  }
  .hint{font-size:11px; color:var(--text-dim); margin-top:2px; font-family:var(--mono);}

  .search-box{padding:10px 16px; border-bottom:1px solid var(--line);}
  .search-box input{width:100%;}

  .groups{flex:1; overflow-y:auto; min-height:0;}
  .group{border-bottom:1px solid var(--line);}
  .group-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 16px;
    cursor:pointer;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-dim);
    background:var(--panel);
    position:sticky; top:0; z-index:1;
  }
  .group-head:hover{color:var(--text);}
  .group-head .count{color:var(--text-dim); font-weight:400;}
  .group-body{display:none;}
  .group.open .group-body{display:block;}
  .group.open .chevron{transform:rotate(90deg);}
  .chevron{transition:transform .12s; font-size:10px;}

  .channel{
    display:flex; align-items:center; gap:10px;
    padding:8px 16px 8px 22px;
    cursor:pointer;
    border-left:2px solid transparent;
  }
  .channel:hover{background:var(--panel-2);}
  .channel.active{
    background:var(--panel-2);
    border-left-color:var(--amber);
  }
  .channel.active .ch-name{color:var(--amber);}
  .ch-logo{
    width:26px; height:26px;
    border-radius:4px;
    background:var(--panel-2);
    object-fit:contain;
    flex-shrink:0;
    border:1px solid var(--line);
  }
  .ch-info{
    flex:1; min-width:0;
    display:flex; flex-direction:column; gap:1px;
  }
  .ch-name{
    font-size:12.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .ch-now{
    font-size:10px;
    font-family:var(--mono);
    color:var(--cyan);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .ch-now:empty{display:none;}
  .epg-btn{
    flex-shrink:0;
    font-size:9.5px;
    padding:4px 6px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
  }
  .epg-btn:hover{border-color:var(--cyan); color:var(--cyan);}
  .empty-state{
    padding:40px 20px;
    text-align:center;
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:12px;
    line-height:1.7;
  }

  /* ── main / player ───────────────────────────────────────────────── */
  .main{
    display:flex; flex-direction:column;
    min-width:0; min-height:0;
    background:#000;
    flex:1 1 auto;
    height:100vh;
    max-width:100vw;
  }
  /* barra "ON AIR / nome canale / IN RIPRODUZIONE" rimossa dall'interfaccia:
     gli elementi restano nel DOM (nascosti) solo perché lo script li aggiorna. */
  .topbar{
    display:none;
  }
  .live-tag{
    font-family:var(--mono);
    font-size:10.5px; font-weight:700;
    letter-spacing:.08em;
    color:#fff;
    background:var(--red-live);
    padding:3px 7px;
    border-radius:3px;
    display:flex; align-items:center; gap:5px;
    visibility:hidden;
  }
  .live-tag.on{visibility:visible;}
  .live-tag .pulse{
    width:6px;height:6px;border-radius:50%;
    background:#fff;
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .now-playing{
    font-family:var(--mono);
    font-size:13.5px;
    font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .now-playing.dim{color:var(--text-dim); font-weight:400;}
  .topbar-right{margin-left:auto; display:flex; align-items:center; gap:10px;}
  .status-pill{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-dim);
    border:1px solid var(--line);
    padding:3px 8px;
    border-radius:3px;
  }

  .video-wrap{
    flex:1;
    position:relative;
    min-height:0;
    background:#000;
  }
  video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    background:#000;
  }
  .menu-btn{
    position:absolute;
    top:10px; left:10px;
    z-index:5;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 11px;
    border-radius:4px;
    font-size:14px;
    line-height:1;
    cursor:pointer;
  }
  .placeholder{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:12px;
    text-align:center;
  }
  .overlay-msg{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(10,12,16,.82);
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--amber);
    text-align:center;
    padding:20px;
  }
  .overlay-msg.show{display:flex;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width: 760px){
    .app{display:block;}
    .main{
      width:100vw; max-width:100vw;
      height:auto;
      aspect-ratio:16/9;
    }
    .sidebar{
      position:fixed; z-index:20; top:4px; bottom:0; left:0; width:82vw; max-width:340px;
      transform:translateX(-100%);
      transition:transform .18s ease;
    }
    .sidebar.open{transform:translateX(0);}
    .menu-btn{display:inline-flex !important;}
  }
  .menu-btn{display:none;}

  /* ── modale guida programmi (EPG) ───────────────────────────────── */
  .epg-modal{
    position:fixed; inset:0; z-index:50;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(6,8,11,.72);
    padding:20px;
  }
  .epg-modal.show{display:flex;}
  .epg-modal-content{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    width:100%; max-width:460px;
    max-height:80vh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .epg-modal-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    font-family:var(--mono);
    font-size:12.5px;
    font-weight:600;
    color:var(--amber);
  }
  .epg-modal-head span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .epg-modal-head button{padding:4px 8px; font-size:12px; flex-shrink:0;}
  .epg-day-tabs{
    display:flex; gap:6px; padding:10px 16px; border-bottom:1px solid var(--line);
    overflow-x:auto; flex-shrink:0;
  }
  .epg-day-tab{
    font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.03em;
    text-transform:uppercase; white-space:nowrap; flex-shrink:0;
    padding:6px 12px; border-radius:20px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text-dim); cursor:pointer;
    transition:border-color .12s, color .12s, background .12s;
  }
  .epg-day-tab:hover{border-color:var(--amber); color:var(--amber);}
  .epg-day-tab.active{background:var(--amber); color:#1a1206; border-color:var(--amber);}
  .epg-modal-body{overflow-y:auto; flex:1; scroll-behavior:smooth;}
  .epg-row{
    display:flex; gap:12px;
    padding:9px 16px;
    border-bottom:1px solid var(--line);
    font-size:12px;
  }
  .epg-row.now{background:var(--panel-2);}
  .epg-row.now .epg-title{color:var(--amber);}
  .epg-time{font-family:var(--mono); color:var(--text-dim); flex-shrink:0; width:92px;}
  .epg-title{flex:1;}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand-row">
        <div class="brand"><span class="dot"></span> IPTV · Console</div>
        <button class="collapse-btn" id="collapseBtn" title="Nascondi barra">◀</button>
      </div>
      <div class="playlist-controls">
        <div class="row">
          <button class="file-btn" style="flex:1">
            File locale…
            <input type="file" id="m3uFile" accept=".m3u,.m3u8,text/plain">
          </button>
        </div>
      </div>
      <div class="hint" id="playlistHint">Nessuna playlist caricata</div>
    </div>
    <div class="search-box">
      <input type="text" id="search" placeholder="Cerca canale…">
    </div>
    <div class="groups" id="groups">
      <div class="empty-state">Carica una playlist M3U (URL o file)<br>per vedere i canali qui.</div>
    </div>
  </aside>

  <button class="sidebar-reopen" id="sidebarReopen" title="Mostra barra">▶</button>

  <main class="main">
    <div class="video-wrap">
      <button class="menu-btn" id="menuBtn" title="Canali">☰</button>
      <video id="video" controls playsinline></video>
      <div class="placeholder" id="placeholder">
        <div>NESSUN SEGNALE — seleziona un canale dalla lista</div>
      </div>
      <div class="overlay-msg" id="overlayMsg"></div>
    </div>
    <!-- elementi mantenuti nel DOM (nascosti) solo perché lo script li aggiorna via id -->
    <div style="display:none">
      <span class="live-tag" id="liveTag"><span class="pulse"></span>ON AIR</span>
      <span class="now-playing dim" id="nowPlaying">Nessun canale selezionato</span>
      <span class="status-pill" id="statusPill">STANDBY</span>
    </div>
  </main>
</div>

<div class="epg-modal" id="epgModal">
  <div class="epg-modal-content">
    <div class="epg-modal-head">
      <span id="epgModalTitle">Guida programmi</span>
      <button id="epgModalClose" type="button">✕</button>
    </div>
    <div class="epg-day-tabs" id="epgDayTabs"></div>
    <div class="epg-modal-body" id="epgModalBody"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const els = {
    video: document.getElementById('video'),
    placeholder: document.getElementById('placeholder'),
    overlay: document.getElementById('overlayMsg'),
    groups: document.getElementById('groups'),
    search: document.getElementById('search'),
    m3uFile: document.getElementById('m3uFile'),
    playlistHint: document.getElementById('playlistHint'),
    nowPlaying: document.getElementById('nowPlaying'),
    liveTag: document.getElementById('liveTag'),
    statusPill: document.getElementById('statusPill'),
    app: document.getElementById('app'),
    sidebar: document.getElementById('sidebar'),
    menuBtn: document.getElementById('menuBtn'),
    collapseBtn: document.getElementById('collapseBtn'),
    sidebarReopen: document.getElementById('sidebarReopen'),
    epgModal: document.getElementById('epgModal'),
    epgModalTitle: document.getElementById('epgModalTitle'),
    epgModalBody: document.getElementById('epgModalBody'),
    epgModalClose: document.getElementById('epgModalClose'),
    epgDayTabs: document.getElementById('epgDayTabs'),
  };

  let channels = [];        // { name, url, logo, group, tvgId }
  let activeChannel = null;
  let hls = null;
  let openGroup = null;   // nome del gruppo attualmente espanso (solo uno alla volta)
  let epgMap = new Map();   // tvgId -> [{ start:Date, stop:Date, title }]

  // ── Parsing M3U (stessa logica dell'app Python: EXTINF + attributi) ──
  function parseM3U(content){
    const lines = content.split(/\r?\n/);
    const result = [];
    let pending = null;

    for (let raw of lines){
      const line = raw.trim();
      if (!line) continue;

      if (line.startsWith('#EXTINF')){
        const info = line.substring(line.indexOf(':') + 1);
        const logoMatch  = info.match(/tvg-logo="([^"]*)"/i);
        const groupMatch = info.match(/group-title="([^"]*)"/i);
        const idMatch    = info.match(/tvg-id="([^"]*)"/i);
        const nameMatch  = info.match(/,(.*)$/);
        pending = {
          name: nameMatch ? nameMatch[1].trim() : 'Canale',
          logo: logoMatch ? logoMatch[1] : '',
          group: groupMatch ? groupMatch[1] : 'Senza categoria',
          tvgId: idMatch ? idMatch[1] : '',
        };
      } else if (line.startsWith('#')){
        continue; // altre direttive (#EXTM3U, #EXTVLCOPT, ecc.) ignorate
      } else {
        // riga URL
        if (pending){
          pending.url = line;
          result.push(pending);
          pending = null;
        }
      }
    }
    return result;
  }

  function groupChannels(list){
    const map = new Map();
    for (const ch of list){
      if (!map.has(ch.group)) map.set(ch.group, []);
      map.get(ch.group).push(ch);
    }
    return map;
  }

  function renderChannels(filterText){
    const filter = (filterText || '').trim().toLowerCase();
    const filtered = filter
      ? channels.filter(c => c.name.toLowerCase().includes(filter))
      : channels;

    if (!filtered.length){
      els.groups.innerHTML = `<div class="empty-state">${channels.length ? 'Nessun canale trovato.' : 'Carica una playlist M3U (URL o file)<br>per vedere i canali qui.'}</div>`;
      return;
    }

    const grouped = groupChannels(filtered);
    const frag = document.createDocumentFragment();

    for (const [groupName, chans] of grouped){
      const isOpen = filter ? true : openGroup === groupName;
      const groupEl = document.createElement('div');
      groupEl.className = 'group' + (isOpen ? ' open' : '');

      const head = document.createElement('div');
      head.className = 'group-head';
      head.innerHTML = `<span><span class="chevron">▶</span> ${escapeHtml(groupName)}</span><span class="count">${chans.length}</span>`;
      head.addEventListener('click', () => {
        if (filter) return; // durante la ricerca i gruppi restano tutti aperti
        const wasOpen = openGroup === groupName;
        openGroup = wasOpen ? null : groupName;
        renderChannels(els.search.value);
        if (!wasOpen){
          // Porta il gruppo appena aperto esattamente in cima alla vista.
          // Le intestazioni sono "position: sticky", quindi scrollIntoView()
          // e getBoundingClientRect() la considerano "già in vista" (perché
          // visivamente resta ancorata in alto) anche quando i canali sotto
          // non lo sono affatto. Calcoliamo quindi la posizione reale
          // sommando le altezze dei gruppi precedenti, che non risentono
          // dell'effetto sticky.
          let top = 0;
          let target = null;
          for (const g of els.groups.children){
            if (g.classList.contains('open')){ target = g; break; }
            top += g.offsetHeight;
          }
          if (target) els.groups.scrollTop = top;
        }
      });

      const body = document.createElement('div');
      body.className = 'group-body';

      for (const ch of chans){
        const item = document.createElement('div');
        item.className = 'channel' + (activeChannel === ch ? ' active' : '');

        const logo = document.createElement('img');
        logo.className = 'ch-logo';
        logo.src = ch.logo || '';
        logo.alt = '';
        logo.addEventListener('error', () => { logo.style.visibility = 'hidden'; });

        const info = document.createElement('div');
        info.className = 'ch-info';

        const nameEl = document.createElement('span');
        nameEl.className = 'ch-name';
        nameEl.textContent = ch.name;

        const nowEl = document.createElement('span');
        nowEl.className = 'ch-now';
        nowEl.dataset.tvgid = ch.tvgId || '';
        nowEl.textContent = nowProgramText(ch.tvgId);

        info.appendChild(nameEl);
        info.appendChild(nowEl);

        item.appendChild(logo);
        item.appendChild(info);

        if (ch.tvgId && epgMap.has(ch.tvgId)){
          const epgBtn = document.createElement('button');
          epgBtn.type = 'button';
          epgBtn.className = 'epg-btn';
          epgBtn.title = 'Guida programmi';
          epgBtn.textContent = 'EPG';
          epgBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            openEpgModal(ch);
          });
          item.appendChild(epgBtn);
        }

        item.addEventListener('click', () => playChannel(ch));
        body.appendChild(item);
      }

      groupEl.appendChild(head);
      groupEl.appendChild(body);
      frag.appendChild(groupEl);
    }

    els.groups.innerHTML = '';
    els.groups.appendChild(frag);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  // ── EPG (XMLTV compresso .gz) ──────────────────────────────────────
  function parseXmltvDate(s){
    // Formato XMLTV: YYYYMMDDHHMMSS [+-]HHMM  (es. "20260703200000 +0200")
    if (!s) return null;
    const m = s.trim().match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+-]\d{4})?$/);
    if (!m) return null;
    const [, Y, Mo, D, H, Mi, S, tz] = m;
    let iso = `${Y}-${Mo}-${D}T${H}:${Mi}:${S}`;
    iso += tz ? (tz.slice(0, 3) + ':' + tz.slice(3)) : 'Z';
    const d = new Date(iso);
    return isNaN(d.getTime()) ? null : d;
  }

  function formatTime(d){
    return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  }

  async function fetchEpgSource(url){
    try{
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const buf = await res.arrayBuffer();
      let bytes = new Uint8Array(buf);
      // decomprimi se è gzip (magic number 1f 8b) o l'URL termina in .gz
      if ((bytes[0] === 0x1f && bytes[1] === 0x8b) || /\.gz$/i.test(url)){
        bytes = pako.ungzip(bytes);
      }
      const xmlText = new TextDecoder('utf-8').decode(bytes);

      // Parsing via regex invece di DOMParser: con XMLTV di grandi dimensioni
      // (migliaia di <programme>) costruire l'albero DOM blocca il thread
      // principale per secondi. Lo scan testuale è molto più veloce ed evita
      // il freeze della UI durante il caricamento EPG.
      const map = new Map();
      const progRe = /<programme\b([^>]*)>([\s\S]*?)<\/programme>/g;
      const attrRe = /(\w+)="([^"]*)"/g;
      const titleRe = /<title\b[^>]*>([\s\S]*?)<\/title>/;
      const decodeEntities = (s) => s
        .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/, '$1')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&')
        .trim();

      let m;
      while ((m = progRe.exec(xmlText))){
        const attrs = {};
        let am;
        attrRe.lastIndex = 0;
        while ((am = attrRe.exec(m[1]))) attrs[am[1]] = am[2];

        const chId = attrs.channel;
        const start = parseXmltvDate(attrs.start);
        const stop  = parseXmltvDate(attrs.stop);
        if (!chId || !start || !stop) continue;

        const titleMatch = titleRe.exec(m[2]);
        const title = titleMatch ? decodeEntities(titleMatch[1]) : '(senza titolo)';

        if (!map.has(chId)) map.set(chId, []);
        map.get(chId).push({ start, stop, title });
      }
      return map;
    }catch(err){
      console.warn('EPG non caricata (' + url + '):', err.message);
      return null;
    }
  }

  // Estrae gli URL EPG dall'attributo url-tvg="a,b,c" della riga #EXTM3U
  // iniziale della playlist (supporta anche x-tvg-url, usato da alcuni tool).
  function extractUrlTvg(text){
    const firstLine = (text.split(/\r?\n/).find(l => l.trim().length > 0) || '').trim();
    if (!/^#EXTM3U/i.test(firstLine)) return [];
    const m = firstLine.match(/(?:url-tvg|x-tvg-url)="([^"]*)"/i);
    if (!m) return [];
    return m[1].split(',').map(s => s.trim()).filter(Boolean);
  }

  // ── Cache EPG (IndexedDB, TTL 6 ore) ────────────────────────────────
  // Evita di rifare fetch + parsing di tutte le sorgenti ad ogni apertura
  // della pagina: se la cache è ancora valida per lo stesso set di URL,
  // viene usata direttamente e loadEPGFromUrls ritorna subito.
  // Si usa IndexedDB e non localStorage perché l'EPG di più giorni/canali
  // può superare facilmente il limite di ~5MB di localStorage: in quel caso
  // la scrittura falliva silenziosamente e la cache non veniva mai salvata,
  // facendo ripartire fetch+parsing ad ogni caricamento.
  const EPG_DB_NAME = 'iptv_epg_db';
  const EPG_STORE_NAME = 'epg';
  const EPG_CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6 ore

  function openEpgDb(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(EPG_DB_NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(EPG_STORE_NAME)){
          req.result.createObjectStore(EPG_STORE_NAME);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function readEpgCache(urlsKey){
    try{
      const db = await openEpgDb();
      const entry = await new Promise((resolve, reject) => {
        const tx = db.transaction(EPG_STORE_NAME, 'readonly');
        const req = tx.objectStore(EPG_STORE_NAME).get(urlsKey);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
      db.close();
      if (!entry) return null;
      if (Date.now() - entry.ts > EPG_CACHE_TTL_MS) return null;
      const map = new Map();
      for (const [chId, progs] of entry.data){
        map.set(chId, progs.map(p => ({ start: new Date(p.start), stop: new Date(p.stop), title: p.title })));
      }
      return map;
    }catch(e){
      return null;
    }
  }

  async function writeEpgCache(urlsKey, map){
    try{
      const data = [];
      for (const [chId, progs] of map){
        data.push([chId, progs.map(p => ({ start: p.start.toISOString(), stop: p.stop.toISOString(), title: p.title }))]);
      }
      const db = await openEpgDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(EPG_STORE_NAME, 'readwrite');
        tx.objectStore(EPG_STORE_NAME).put({ ts: Date.now(), data }, urlsKey);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
      db.close();
    }catch(e){
      // IndexedDB non disponibile o altro errore: non blocca nulla,
      // si ricaricherà al prossimo giro
    }
  }

  // Carica ed unisce più sorgenti EPG in un'unica mappa tvg-id -> programmi.
  async function loadEPGFromUrls(urls){
    if (!urls || !urls.length){
      epgMap = new Map();
      renderChannels(els.search.value);
      return { ok: 0, total: 0 };
    }

    const urlsKey = urls.slice().sort().join('|');
    const cached = await readEpgCache(urlsKey);
    if (cached){
      epgMap = cached;
      renderChannels(els.search.value);
      return { ok: urls.length, total: urls.length, cached: true };
    }

    const results = await Promise.all(urls.map(fetchEpgSource));
    const merged = new Map();
    let ok = 0;
    for (const map of results){
      if (!map) continue;
      ok++;
      for (const [chId, progs] of map){
        if (!merged.has(chId)) merged.set(chId, []);
        merged.get(chId).push(...progs);
      }
    }
    for (const progs of merged.values()) progs.sort((a, b) => a.start - b.start);
    epgMap = merged;
    if (ok > 0) await writeEpgCache(urlsKey, merged);
    renderChannels(els.search.value); // aggiorna anche i pulsanti EPG mostrati
    return { ok, total: urls.length };
  }

  function getNowProgram(tvgId){
    const progs = epgMap.get(tvgId);
    if (!progs) return null;
    const now = new Date();
    return progs.find(p => now >= p.start && now < p.stop) || null;
  }

  function nowProgramText(tvgId){
    if (!tvgId) return '';
    const p = getNowProgram(tvgId);
    return p ? `▶ ${p.title}` : '';
  }

  function refreshNowPlayingLabels(){
    els.groups.querySelectorAll('.ch-now').forEach(el => {
      const tvgId = el.dataset.tvgid;
      if (tvgId) el.textContent = nowProgramText(tvgId);
    });
  }
  setInterval(refreshNowPlayingLabels, 60000);

  // ── EPG: raggruppamento per giorno (Ieri / Oggi / Domani / …) ─────
  let currentEpgProgs = [];
  let currentEpgDayKey = null;

  function dayKeyOf(d){
    // chiave YYYY-MM-DD in ora locale
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function dayLabelOf(key){
    const now = new Date();
    const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const [Y, Mo, D] = key.split('-').map(Number);
    const d = new Date(Y, Mo - 1, D);
    const diffDays = Math.round((d - todayMidnight) / 86400000);
    if (diffDays === 0) return 'Oggi';
    if (diffDays === -1) return 'Ieri';
    if (diffDays === 1) return 'Domani';
    return d.toLocaleDateString('it-IT', { weekday: 'short', day: '2-digit', month: '2-digit' }).replace('.', '');
  }

  function openEpgModal(ch){
    els.epgModalTitle.textContent = ch.name;
    els.epgModalBody.innerHTML = '';
    els.epgDayTabs.innerHTML = '';
    currentEpgProgs = (epgMap.get(ch.tvgId) || []).slice().sort((a, b) => a.start - b.start);

    if (!currentEpgProgs.length){
      els.epgModalBody.innerHTML = '<div class="empty-state">Nessun dato EPG disponibile per questo canale.</div>';
      els.epgModal.classList.add('show');
      return;
    }

    // giorni disponibili, in ordine cronologico
    const dayKeys = [];
    for (const p of currentEpgProgs){
      const k = dayKeyOf(p.start);
      if (!dayKeys.includes(k)) dayKeys.push(k);
    }
    dayKeys.sort();

    const todayKey = dayKeyOf(new Date());
    const initialKey = dayKeys.includes(todayKey)
      ? todayKey
      : (dayKeys.find(k => k >= todayKey) || dayKeys[dayKeys.length - 1]);

    for (const key of dayKeys){
      const tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'epg-day-tab';
      tab.textContent = dayLabelOf(key);
      tab.addEventListener('click', () => selectEpgDay(key));
      tab.dataset.key = key;
      els.epgDayTabs.appendChild(tab);
    }

    selectEpgDay(initialKey);
    els.epgModal.classList.add('show');
  }

  function selectEpgDay(key){
    currentEpgDayKey = key;

    els.epgDayTabs.querySelectorAll('.epg-day-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.key === key);
    });

    const dayProgs = currentEpgProgs.filter(p => dayKeyOf(p.start) === key);
    els.epgModalBody.innerHTML = '';

    if (!dayProgs.length){
      els.epgModalBody.innerHTML = '<div class="empty-state">Nessun programma per questo giorno.</div>';
      return;
    }

    const now = new Date();
    let nowRow = null;
    for (const p of dayProgs){
      const row = document.createElement('div');
      const isNow = now >= p.start && now < p.stop;
      row.className = 'epg-row' + (isNow ? ' now' : '');
      const time = document.createElement('span');
      time.className = 'epg-time';
      time.textContent = `${formatTime(p.start)}–${formatTime(p.stop)}`;
      const title = document.createElement('span');
      title.className = 'epg-title';
      title.textContent = p.title;
      row.appendChild(time);
      row.appendChild(title);
      els.epgModalBody.appendChild(row);
      if (isNow) nowRow = row;
    }

    // se stiamo guardando "oggi" e c'è un programma in onda, saltaci direttamente
    if (nowRow){
      nowRow.scrollIntoView({ block: 'center' });
    } else {
      els.epgModalBody.scrollTop = 0;
    }
  }

  function closeEpgModal(){
    els.epgModal.classList.remove('show');
  }

  // ── Caricamento playlist ─────────────────────────────────────────
  async function loadFromUrl(url){
    setHint('Caricamento playlist…');
    try{
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      applyPlaylist(text, url);
    }catch(err){
      setHint('Errore caricamento: ' + err.message);
    }
  }

  function loadFromFile(file){
    setHint('Lettura file…');
    const reader = new FileReader();
    reader.onload = () => applyPlaylist(reader.result, file.name);
    reader.onerror = () => setHint('Errore lettura file.');
    reader.readAsText(file);
  }

  function applyPlaylist(text, sourceLabel){
    const parsed = parseM3U(text);
    channels = parsed;
    activeChannel = null;
    renderChannels(els.search.value);
    setHint(`${parsed.length} canali · ${sourceLabel}`);
    try{ localStorage.setItem('iptv_last_source', sourceLabel); }catch(e){}

    const epgUrls = extractUrlTvg(text);
    if (epgUrls.length){
      setHint(`${parsed.length} canali · ${sourceLabel} · caricamento EPG…`);
      loadEPGFromUrls(epgUrls).then(({ ok, total, cached }) => {
        const suffix = cached ? ' (cache)' : '';
        setHint(`${parsed.length} canali · ${sourceLabel} · EPG ${ok}/${total} caricati${suffix}`);
      });
    } else {
      epgMap = new Map();
      renderChannels(els.search.value);
    }
  }

  function setHint(msg){ els.playlistHint.textContent = msg; }

  // ── Player HLS con auto-restart (watchdog, come nell'app Python) ──
  let watchdogTimer = null;
  let retryCount = 0;
  const MAX_RETRY = 5;
  let currentEngine = null;   // 'hls' | 'native' — motore in uso per lo stream corrente
  let fallbackUsed = false;   // true dopo aver già tentato il motore alternativo
  let useProxy = false;       // true dopo essere passati al proxy per il canale corrente

  function clearWatchdog(){
    if (watchdogTimer){ clearTimeout(watchdogTimer); watchdogTimer = null; }
  }

  function playChannel(ch){
    activeChannel = ch;
    renderChannels(els.search.value);
    els.nowPlaying.textContent = ch.name;
    els.nowPlaying.classList.remove('dim');
    els.placeholder.style.display = 'none';
    els.overlay.classList.remove('show');
    els.statusPill.textContent = 'CONNESSIONE…';
    els.liveTag.classList.remove('on');
    retryCount = 0;
    fallbackUsed = false;
    currentEngine = null;
    useProxy = false;
    startStream(ch.url);
    if (window.innerWidth <= 760) els.sidebar.classList.remove('open');
  }

  // Worker Cloudflare che espone /proxy. Va assoluto perché questa pagina
  // ora vive su un'origine diversa (es. GitHub Pages), non più sullo
  // stesso Worker.
  const PROXY_ORIGIN = 'https://tv.xer94x.workers.dev';

  function proxyUrl(url){
    return `${PROXY_ORIGIN}/proxy?url=${encodeURIComponent(url)}`;
  }

  function startStream(url, engine){
    clearWatchdog();
    if (hls){ hls.destroy(); hls = null; }

    if (!engine){
      const canNative = !!els.video.canPlayType('application/vnd.apple.mpegurl');
      const canHls = Hls.isSupported();
      if (canHls) engine = 'hls';
      else if (canNative) engine = 'native';
    }
    currentEngine = engine;

    // Di default lo stream (anche con hls.js) viene caricato direttamente
    // dall'URL originale, senza passare dal /proxy — risparmia richieste
    // per tutti i canali il cui CDN espone già header CORS validi. Il
    // proxy viene attivato solo su richiesta, dopo un fallimento (vedi
    // attemptFallback), per i canali che invece ne hanno davvero bisogno.
    const effectiveUrl = (engine === 'hls' && useProxy) ? proxyUrl(url) : url;

    if (engine === 'native'){
      els.video.removeAttribute('src');
      els.video.load();
      els.video.src = effectiveUrl;
      els.video.addEventListener('loadedmetadata', () => {
        els.video.play().catch(() => {});
        els.statusPill.textContent = 'IN RIPRODUZIONE';
        els.liveTag.classList.add('on');
        retryCount = 0;
      }, { once:true });
      els.video.addEventListener('error', () => attemptFallback('native', 'Errore riproduzione stream', url), { once:true });

    } else if (engine === 'hls'){
      els.video.removeAttribute('src');
      els.video.load();
      hls = new Hls({
        liveSyncDurationCount: 3,
        maxBufferLength: 20,
        manifestLoadingMaxRetry: 4,
        levelLoadingMaxRetry: 4,
        fragLoadingMaxRetry: 4,
      });
      hls.loadSource(effectiveUrl);
      hls.attachMedia(els.video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        els.video.play().catch(() => {});
      });

      hls.on(Hls.Events.FRAG_BUFFERED, () => {
        els.statusPill.textContent = 'IN RIPRODUZIONE';
        els.liveTag.classList.add('on');
        retryCount = 0;
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.MEDIA_ERROR){
          hls.recoverMediaError();
          return;
        }
        const label = data.type === Hls.ErrorTypes.NETWORK_ERROR
          ? 'Errore di rete sullo stream' : 'Errore riproduzione stream';
        attemptFallback('hls', label, url);
      });

    } else {
      showOverlay('Il browser non supporta la riproduzione HLS.');
      return;
    }

    // watchdog: se non arriva nessun frame entro N secondi, prova il motore
    // alternativo (se non già tentato) o riavvia
    watchdogTimer = setTimeout(() => {
      if (els.statusPill.textContent !== 'IN RIPRODUZIONE'){
        attemptFallback(engine, 'Timeout connessione stream', url);
      }
    }, 15000);
  }

  // Se il motore attivo fallisce, prova UNA volta l'altro motore disponibile
  // prima di arrendersi ed entrare nel normale ciclo di retry.
  function attemptFallback(fromEngine, label, url){
    // Passo intermedio: se stavamo usando hls.js in modalità diretta (senza
    // proxy) e la connessione fallisce, spesso è un problema di CORS —
    // riprova lo stesso stream passando dal /proxy prima di cambiare motore
    // o arrenderti. Così il proxy si attiva solo per i canali che ne hanno
    // davvero bisogno, non per tutti fin dall'inizio.
    if (fromEngine === 'hls' && !useProxy){
      useProxy = true;
      clearWatchdog();
      if (hls){ hls.destroy(); hls = null; }
      els.statusPill.textContent = 'CONNESSIONE TRAMITE PROXY…';
      startStream(url, 'hls');
      return;
    }

    if (!fallbackUsed){
      const canNative = !!els.video.canPlayType('application/vnd.apple.mpegurl');
      const canHls = Hls.isSupported();
      let alt = null;
      if (fromEngine === 'hls' && canNative) alt = 'native';
      else if (fromEngine === 'native' && canHls) alt = 'hls';

      if (alt){
        fallbackUsed = true;
        clearWatchdog();
        if (hls){ hls.destroy(); hls = null; }
        els.statusPill.textContent = 'CAMBIO MODALITÀ DI RIPRODUZIONE…';
        startStream(url, alt);
        return;
      }
    }
    handleStreamError(label);
  }

  function handleStreamError(label){
    scheduleRestart(label);
  }

  function scheduleRestart(reason){
    clearWatchdog();
    if (!activeChannel) return;
    retryCount++;
    if (retryCount > MAX_RETRY){
      showOverlay(reason + '.\nTentativi esauriti — riprova manualmente o cambia canale.');
      els.statusPill.textContent = 'ERRORE';
      return;
    }
    showOverlay(`${reason}.\nRiconnessione in corso… (tentativo ${retryCount}/${MAX_RETRY})`);
    els.statusPill.textContent = 'RICONNESSIONE…';
    els.liveTag.classList.remove('on');
    const delay = Math.min(1500 * retryCount, 8000);
    setTimeout(() => {
      if (activeChannel){
        els.overlay.classList.remove('show');
        startStream(activeChannel.url, currentEngine);
      }
    }, delay);
  }

  function showOverlay(msg){
    els.overlay.textContent = msg;
    els.overlay.classList.add('show');
  }

  // ── eventi UI ───────────────────────────────────────────────────
  els.m3uFile.addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) loadFromFile(file);
  });
  els.search.addEventListener('input', () => renderChannels(els.search.value));
  els.menuBtn.addEventListener('click', () => els.sidebar.classList.toggle('open'));

  // ── collassa/mostra barra laterale (desktop) ──────────────────────
  function setSidebarCollapsed(collapsed){
    els.sidebar.classList.toggle('collapsed', collapsed);
    els.sidebarReopen.classList.toggle('show', collapsed);
    els.app.classList.toggle('sidebar-collapsed', collapsed);
    try{ localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); }catch(e){}
  }
  els.collapseBtn.addEventListener('click', () => setSidebarCollapsed(true));
  els.sidebarReopen.addEventListener('click', () => setSidebarCollapsed(false));
  try{
    if(localStorage.getItem('sidebarCollapsed') === '1') setSidebarCollapsed(true);
  }catch(e){}

  els.epgModalClose.addEventListener('click', closeEpgModal);
  els.epgModal.addEventListener('click', e => { if (e.target === els.epgModal) closeEpgModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEpgModal(); });

  // ── Auto-caricamento da GitHub (playlist; gli EPG vengono letti
  //    automaticamente dal tag url-tvg nella riga #EXTM3U della playlist) ──
  const AUTO_M3U_URL = 'https://raw.githubusercontent.com/xer94x/tv/main/streaming.m3u';

  async function autoLoad(){
    setHint('Caricamento playlist da GitHub…');
    try{
      const res = await fetch(AUTO_M3U_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const m3uText = await res.text();
      applyPlaylist(m3uText, 'streaming.m3u (GitHub)');
    }catch(err){
      setHint('Errore caricamento automatico della playlist — carica manualmente.');
    }
  }

  autoLoad();

})();
</script>
</body>
</html>
