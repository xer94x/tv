name: Aggiorna Playlist
on:
  schedule:
    - cron: '0 4 * * *'   # ogni giorno alle 04:00 UTC
  workflow_dispatch:      # avvio manuale dal tab Actions
permissions:
  contents: write         # necessario per commit e push con GITHUB_TOKEN
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assicura presenza file
        run: |
          for f in tivustream.m3u freetv.m3u samsung.m3u webtv.m3u netplus.mpd netplus.m3u roku_all.m3u pluto.m3u usaTV.m3u; do
            [ -f "$f" ] || touch "$f"
          done
      - name: Scarica playlist
        run: |
          download() {
            local url="$1"
            local file="$2"
            echo "→ $file da $url"
            [ -f "$file" ] || touch "$file"
            if curl -fsSL --max-time 30 "$url" -o "$file.tmp" && grep -q "#EXTINF\|#EXTM3U\|#KODIPROP\|<MPD" "$file.tmp"; then
              mv "$file.tmp" "$file"
              echo "  ✓ OK ($(wc -l < "$file") righe)"
            else
              rm -f "$file.tmp"
              echo "  ✗ Fallito o vuoto — file precedente mantenuto"
            fi
          }
          download "https://tivustream.website/urls/listm3u" "tivustream.m3u"
          download "https://cdn.jsdelivr.net/gh/Free-TV/IPTV@master/playlists/playlist_italy.m3u8" "freetv.m3u"
          download "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/samsungtvplus_it.m3u" "samsung.m3u"
          download "https://iptv-ch.github.io/webtv.m3u" "webtv.m3u"
          download "https://iptv-ch.github.io/netplus.mpd" "netplus.mpd"
          download "https://iptv-ch.github.io/netplus.m3u8" "netplus.m3u"
          download "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/roku_all.m3u" "roku_all.m3u"
          download "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plutotv_it.m3u" "pluto.m3u"
          download "https://github.com/doms9/iptv/raw/refs/heads/default/M3U8/TV.m3u8" "usaTV.m3u"
      - name: Commit e push (solo se ci sono modifiche)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in tivustream.m3u freetv.m3u samsung.m3u webtv.m3u netplus.mpd netplus.m3u roku_all.m3u pluto.m3u usaTV.m3u; do
            [ -f "$f" ] && git add "$f"
          done
          git status --short
          if git diff --cached --quiet; then
            echo "Nessuna modifica, skip commit."
          else
            git commit -m "chore: aggiorna playlist $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

